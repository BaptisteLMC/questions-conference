<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
    --bg: #EEF1F6;
    --surface: #FFFFFF;
    --ink: #18213A;
    --muted: #5B6478;
    --line: #D5DAE4;
    --accent: #2747A8;
    --on-accent: #FFFFFF;
    --ok: #0E7C66;
    --ok-bg: #E3F4EF;
    --on-ok: #FFFFFF;
    --pending: #B7791F;
    --pending-bg: #FFF4DF;
    --danger: #B3261E;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #121829; --surface: #1B2338; --ink: #E9EDF5; --muted: #9AA3B8; --line: #2C3650;
      --accent: #8EA6FF; --on-accent: #0E1426; --ok: #3CC7A3; --ok-bg: #15302A; --on-ok: #0B1F1A;
      --pending: #E3A83B; --pending-bg: #2A2416; --danger: #F07167;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121829; --surface: #1B2338; --ink: #E9EDF5; --muted: #9AA3B8; --line: #2C3650;
    --accent: #8EA6FF; --on-accent: #0E1426; --ok: #3CC7A3; --ok-bg: #15302A; --on-ok: #0B1F1A;
    --pending: #E3A83B; --pending-bg: #2A2416; --danger: #F07167;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  body {
    margin: 0; height: 100%;
    font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 17px; line-height: 1.45;
    background: var(--bg); color: var(--ink);
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  h1, h2, p { margin: 0; }

  .btn {
    min-height: 48px; padding: 0 18px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface);
    font-weight: 700; cursor: pointer; white-space: nowrap;

  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.ok { background: var(--ok); border-color: var(--ok); color: var(--on-ok); }
  .btn.ghost { background: transparent; }
  .btn.danger { background: transparent; border-color: transparent; color: var(--danger); }
  .btn.small { min-height: 40px; padding: 0 12px; font-size: 15px; }
  .field { display: grid; gap: 6px; }
  .field label { font-weight: 700; }
  .field input, .field textarea, select {
    width: 100%; border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface); padding: 12px 14px;
  }
  select { min-height: 44px; padding: 8px 12px; width: auto; }
  .muted { color: var(--muted); }

  /* Bandeau démo */
  .demo {
    background: var(--pending-bg); color: var(--ink); border-bottom: 1px solid var(--line);
    padding: 8px 16px; font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
  }
  .demo a { color: var(--accent); font-weight: 700; }

  /* Participant */
  .participant { max-width: 560px; margin: 0 auto; padding: 28px 20px 40px; display: grid; gap: 22px; }
  .participant h1 { font-size: 1.9rem; line-height: 1.15; }
  .p-theme { font-size: 1.1rem; color: var(--muted); }
  .p-theme strong { color: var(--ink); }
  .participant form { display: grid; gap: 16px; }
  .participant textarea { min-height: 150px; resize: vertical; font-size: 1.1rem; }
  .count { font-size: 14px; color: var(--muted); justify-self: end; }
  .msg { min-height: 1.5em; font-weight: 700; }
  .msg.ok { color: var(--ok); }
  .msg.err { color: var(--danger); }

  /* Modération */
  .mod { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }
  .bar {

  .bar .title { display: grid; }

  .brand { display: flex; align-items: center; gap: 14px; }

  .ecran .brand { flex-direction: column; text-align: center; gap: 2vh; }
  .ecran .brand img { max-height: 18vh; max-width: 36vw; }
  .ecran .brand .name strong { font-size: clamp(1.4rem, 3vw, 2.6rem); }
  .ecran .brand .name span { font-size: clamp(1rem, 1.8vw, 1.5rem); }

  /* Personnalisation */
  .reglages { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; padding: 20px 16px 48px; max-width: 1100px; margin: 0 auto; }
  .reglages form { display: grid; gap: 18px; align-content: start; }
  .reglages fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 18px; margin: 0; display: grid; gap: 14px; background: var(--surface); }
  .reglages legend { font-weight: 700; padding: 0 6px; }
  .reglages textarea { min-height: 80px; resize: vertical; }
  .field input[type="color"] { width: 96px; height: 48px; padding: 4px; }
  .field input[type="file"] { padding: 10px; }
  .hint { color: var(--muted); font-size: 14px; }
  .logo-box { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-height: 48px; }
  .logo-box img {
    max-height: 70px; max-width: 180px; object-fit: contain; padding: 6px; border-radius: 6px;
    background: repeating-conic-gradient(var(--line) 0 25%, transparent 0 50%) 0 0 / 14px 14px;
  }
  .check { display: flex; gap: 10px; align-items: center; font-weight: 700; }
  .check input { width: 22px; height: 22px; }
  .preview-wrap { position: sticky; top: 16px; align-self: start; display: grid; gap: 12px; }
  .preview-wrap h2 { font-size: 1.05rem; }
  .preview { border: 1px solid var(--line); border-radius: 18px; background: var(--bg); padding: 22px 20px; display: grid; gap: 16px; }
  .preview .pv-title { font-size: 1.6rem; font-weight: 700; line-height: 1.15; }
  .preview .pv-btn { justify-self: start; display: inline-flex; align-items: center; pointer-events: none; }
  @media (max-width: 760px) { .reglages { grid-template-columns: 1fr; } .preview-wrap { position: static; } }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 700;
    max-width: 90vw;
  }

  @media (max-width: 760px) {
    body { height: auto; }
    .mod { height: auto; }
    .cols { grid-template-columns: 1fr; }
    .col { overflow: visible; }
    .col + .col { border-left: 0; border-top: 1px solid var(--line); }
  }
  @media (prefers-reduced-motion: reduce) { .card.fresh { animation: none; } }
</style>

const params = new URLSearchParams(location.search);

/* ---------- utilitaires ---------- */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(16).slice(2));
const heure = (s) => s ? new Date(s).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) : "";
let toastTimer;
function toast(text) {
  document.querySelector(".toast")?.remove();
  const t = h("div", { class: "toast", role: "status", text });
  document.body.append(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 3500);
}
function patchFor(status) {
  const now = new Date().toISOString();
  if (status === "validated") return { status, validated_at: now };
  if (status === "asked") return { status, asked_at: now };
  if (status === "pending") return { status, validated_at: null, asked_at: null };
  return { status };
}

/* ---------- habillage ---------- */
function luminance(hex) {
  const [r, g, b] = [1, 3, 5].map((i) => {
    const c = parseInt(hex.slice(i, i + 2), 16) / 255;
    return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
function applyBranding(s, { screen = false } = {}) {
  const root = document.documentElement;
  document.title = s.event_name ? s.event_name + " – Questions" : "Questions du public";
  if (/^#[0-9a-f]{6}$/i.test(s.accent || "")) {
    root.style.setProperty("--accent", s.accent);
    root.style.setProperty("--on-accent", luminance(s.accent) > 0.45 ? "#10162A" : "#FFFFFF");
  }
  if (screen) {
    if (s.screen_theme === "light" || s.screen_theme === "dark") root.dataset.theme = s.screen_theme;
    else delete root.dataset.theme;
  }
}
const safeLogo = (s) => (typeof s.logo === "string" && s.logo.startsWith("data:image/") ? s.logo : "");
function brandHeader(s) {
  const logo = safeLogo(s);
  if (!logo && !s.event_name && !s.event_subtitle) return null;
  return h("div", { class: "brand" },
    logo ? h("img", { src: logo, alt: s.event_name ? "Logo " + s.event_name : "Logo de l'événement" }) : null,
    (s.event_name || s.event_subtitle) ? h("div", { class: "name" },
      s.event_name ? h("strong", { text: s.event_name }) : null,
      s.event_subtitle ? h("span", { text: s.event_subtitle }) : null) : null);
}
async function logoToDataUrl(file) {
  if (file.size > 8 * 1024 * 1024) throw new Error("Fichier trop lourd : 8 Mo maximum.");
  const url = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result); r.onerror = () => rej(new Error("Lecture du fichier impossible."));
    r.readAsDataURL(file);
  });
  if (file.type === "image/svg+xml") {
    if (url.length > 300000) throw new Error("SVG trop lourd : 200 Ko maximum.");
    return url;
  }
  const img = await new Promise((res, rej) => {
    const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("Image illisible. Utilise un PNG, JPG ou SVG.")); i.src = url;
  });
  const scale = Math.min(1, 800 / img.width, 400 / img.height);
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(img.width * scale)); c.height = Math.max(1, Math.round(img.height * scale));
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  let out = c.toDataURL("image/png");
  if (out.length > 400000) out = c.toDataURL("image/webp", 0.9);
  return out;
}

/* ---------- stockage : démo locale ---------- */
function demoStore() {
  const KEY = "qa-demo-v1";
  const bc = "BroadcastChannel" in window ? new BroadcastChannel(KEY) : null;
  const listeners = new Set();
  const fire = () => listeners.forEach((f) => f("all"));
  const read = () => {
    try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) return s; } catch (e) {}
    const s = { themes: [
      { id: uid(), name: "Table ronde 1", position: 1, active: true },
      { id: uid(), name: "Table ronde 2", position: 2, active: false },
    ], questions: [], settings: {} };
    write(s, false);
    return s;
  };
  const write = (s, notify = true) => {
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
    if (notify) { bc?.postMessage("change"); fire(); }
  };
  if (bc) bc.onmessage = fire;
  else window.addEventListener("storage", (e) => { if (e.key === KEY) fire(); });
  return {
    demo: true,
    async session() { return true; },
    async login() {}, async logout() {},
    start() {},
    onChange(fn) { listeners.add(fn); },
    async themes() { return [...read().themes].sort((a, b) => a.position - b.position); },
    async questions() { return read().questions; },
    async ask({ text, author }) {
      const s = read();
      const active = s.themes.find((t) => t.active);
      s.questions.push({ id: uid(), theme_id: active?.id || null, text, author: author || null,
        status: "pending", created_at: new Date().toISOString(), validated_at: null, asked_at: null });
      write(s);
    },
    async update(id, patch) {
      const s = read();
      const q = s.questions.find((x) => x.id === id);
      if (q) Object.assign(q, patch);
      write(s);
    },
    async setActive(id) { const s = read(); s.themes.forEach((t) => (t.active = t.id === id)); write(s); },
    async addTheme(name) {
      const s = read();
      const max = Math.max(0, ...s.themes.map((t) => t.position || 0));
      s.themes.push({ id: uid(), name, position: max + 1, active: s.themes.length === 0 });
      write(s);
    },
    async renameTheme(id, name) { const s = read(); const t = s.themes.find((x) => x.id === id); if (t) t.name = name; write(s); },
    async deleteTheme(id) {
      const s = read();
      s.themes = s.themes.filter((t) => t.id !== id);
      s.questions.forEach((q) => { if (q.theme_id === id) q.theme_id = null; });
      write(s);
    },
    async reorderThemes(ids) {
      const s = read();
      ids.forEach((id, i) => { const t = s.themes.find((x) => x.id === id); if (t) t.position = i + 1; });
      write(s);
    },
    async getSettings() { return read().settings || {}; },
    async settingsVersion() { return read().settings_v || 0; },
    async saveSettings(data) {
      const s = read(); s.settings = data; s.settings_v = Date.now();
      try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { throw new Error("Logo trop lourd pour le mode démo."); }
      bc?.postMessage("change"); fire();
    },
  };
}

/* ---------- stockage : Supabase ---------- */
function supaStore() {
  const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const listeners = new Set();
  const fire = (table, payload) => listeners.forEach((f) => f(table, payload));
  let channel = null;
  // Le temps réel doit porter le jeton du compte connecté, sinon la base filtre les questions.
  sb.auth.onAuthStateChange((_event, session) => { if (session) sb.realtime.setAuth(session.access_token); });
  const subscribe = async () => {
    const { data } = await sb.auth.getSession();
    if (data.session) sb.realtime.setAuth(data.session.access_token);
    if (channel) await sb.removeChannel(channel);
    const on = (table) => (payload) => fire(table, payload);
    channel = sb.channel("qa")
      .on("postgres_changes", { event: "*", schema: "public", table: "themes" }, on("themes"))
      .on("postgres_changes", { event: "*", schema: "public", table: "questions" }, on("questions"))
      .on("postgres_changes", { event: "*", schema: "public", table: "settings" }, on("settings"))
      .subscribe((status) => { if (status === "SUBSCRIBED") fire("resync"); });
  };
  const check = ({ data, error }) => { if (error) throw error; return data; };
  return {
    demo: false,
    async session() { return (await sb.auth.getSession()).data.session; },
    async login(email, password) { check(await sb.auth.signInWithPassword({ email, password })); },
    async logout() { await sb.auth.signOut(); },
    start() { subscribe(); },
    onChange(fn) { listeners.add(fn); },
    async themes() { return check(await sb.from("themes").select("*").order("position")); },
    async questions() { return check(await sb.from("questions").select("*").order("created_at")); },
    async ask({ text, author }) { check(await sb.from("questions").insert({ text, author: author || null })); },
    async update(id, patch) { check(await sb.from("questions").update(patch).eq("id", id)); },
    async setActive(id) { check(await sb.rpc("set_active_theme", { tid: id })); },
    async addTheme(name) {
      const ts = await this.themes();
      const max = Math.max(0, ...ts.map((t) => t.position || 0));
      check(await sb.from("themes").insert({ name, position: max + 1, active: ts.length === 0 }));
    },
    async renameTheme(id, name) { check(await sb.from("themes").update({ name }).eq("id", id)); },
    async deleteTheme(id) { check(await sb.from("themes").delete().eq("id", id)); },
    async reorderThemes(ids) {
      await Promise.all(ids.map((id, i) => sb.from("themes").update({ position: i + 1 }).eq("id", id).then(check)));
    },
    async getSettings() {
      const row = check(await sb.from("settings").select("data").eq("id", 1).maybeSingle());
      return row?.data || {};
    },
    async settingsVersion() {
      const row = check(await sb.from("settings").select("updated_at").eq("id", 1).maybeSingle());
      return row?.updated_at || 0;
    },
    async saveSettings(data) {
      check(await sb.from("settings").upsert({ id: 1, data, updated_at: new Date().toISOString() }));
    },
  };
}

/* ---------- vue participant ---------- */
async function viewParticipant() {
  let settings = { ...DEFAULT_SETTINGS };
  const brandEl = h("div");
  const titleEl = h("h1", { text: settings.participant_title });
  const themeEl = h("p", { class: "p-theme" });
  const ta = h("textarea", { id: "q", maxlength: CONFIG.MAX_CARACTERES, rows: 5, required: true,
    placeholder: "Écrivez votre question ici" });
  const count = h("span", { class: "count" });
  const author = h("input", { id: "a", maxlength: 40, autocomplete: "given-name", placeholder: "Facultatif" });
  const nameField = h("div", { class: "field" }, h("label", { for: "a" }, "Votre prénom"), author);
  const btn = h("button", { class: "btn primary", type: "submit" }, "Envoyer ma question");
  const msg = h("p", { class: "msg", role: "status", "aria-live": "polite" });
  const updateCount = () => (count.textContent = `${ta.value.length} / ${CONFIG.MAX_CARACTERES}`);
  ta.addEventListener("input", updateCount); updateCount();

  const lastKey = "qa-last-sent";
  let tick;
  const cooldown = () => {
    clearInterval(tick);
    const run = () => {
      let last = 0;
      try { last = Number(localStorage.getItem(lastKey) || 0); } catch (e) {}
      const left = Math.ceil((last + CONFIG.COOLDOWN_SECONDES * 1000 - Date.now()) / 1000);
      if (left > 0) { btn.disabled = true; btn.textContent = `Nouvelle question dans ${left} s`; }
      else { btn.disabled = false; btn.textContent = "Envoyer ma question"; clearInterval(tick); }
    };
    run(); tick = setInterval(run, 1000);
  };

  const form = h("form", { onsubmit: async (e) => {
    e.preventDefault();
    const text = ta.value.trim();
    if (text.length < 3) { msg.className = "msg err"; msg.textContent = "Votre question doit faire au moins 3 caractères."; return; }
    btn.disabled = true;
    try {
      await store.ask({ text, author: settings.ask_name ? author.value.trim() : "" });
      try { localStorage.setItem(lastKey, String(Date.now())); } catch (err) {}
      ta.value = ""; updateCount();
      msg.className = "msg ok"; msg.textContent = settings.thanks_message || DEFAULT_SETTINGS.thanks_message;
    } catch (err) {
      msg.className = "msg err"; msg.textContent = "Envoi impossible. Vérifiez votre connexion et réessayez.";
      console.error(err);
    }
    cooldown();
  } },
    h("div", { class: "field" }, h("label", { for: "q" }, "Votre question"), ta, count),
    nameField, btn, msg);

  app.replaceChildren(demoBanner() || "", h("main", { class: "participant" }, brandEl, titleEl, themeEl, form));

  let version = null;
  const load = async () => {
    try {
      const [themes, v] = await Promise.all([store.themes(), store.settingsVersion()]);
      if (v !== version) {
        settings = { ...DEFAULT_SETTINGS, ...(await store.getSettings()) };
        version = v;
        applyBranding(settings);
        brandEl.replaceChildren(brandHeader(settings) || "");
        titleEl.textContent = settings.participant_title || DEFAULT_SETTINGS.participant_title;
        nameField.hidden = !settings.ask_name;
      }
      const active = themes.find((t) => t.active);
      themeEl.replaceChildren(active ? h("span", {}, "En ce moment : ", h("strong", {}, active.name)) : "");
    } catch (e) { console.error(e); }
  };
  // Le public n'ouvre pas de connexion temps réel (quota Supabase gratuit : 200 connexions simultanées).
  // La page se rafraîchit toutes les 20 s et au retour sur l'onglet ; en démo, les onglets restent synchronisés.
  store.onChange(load);
  setInterval(load, 20000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
  load();
  cooldown();
}

/* ---------- vue écran (QR code) ---------- */
async function viewEcran() {
  const brandEl = h("div");
  const title = h("h1");
  const theme = h("p", { class: "theme" });
  const qr = h("div", { class: "qr", role: "img", "aria-label": "QR code vers la page des questions" });
  app.replaceChildren(demoBanner() || "", h("main", { class: "ecran" }, h("div", { class: "ecran-inner" },
    h("div", { class: "text-block" }, brandEl, title, theme, h("p", { class: "url", text: BASE_URL })), qr)));
  const landscape = innerWidth > innerHeight && innerWidth >= 800;
  const size = Math.floor(landscape ? Math.min(innerHeight * 0.62, innerWidth * 0.38) : Math.min(innerWidth * 0.7, innerHeight * 0.42));
  if (window.QRCode) new QRCode(qr, { text: BASE_URL, width: size, height: size, correctLevel: QRCode.CorrectLevel.M });
  const loadSettings = async () => {
    try {
      const st = { ...DEFAULT_SETTINGS, ...(await store.getSettings()) };
      applyBranding(st, { screen: true });
      brandEl.replaceChildren(brandHeader(st) || "");
      title.textContent = st.screen_title || DEFAULT_SETTINGS.screen_title;
    } catch (e) { console.error(e); }
  };
  const loadThemes = async () => {
    try {
      const active = (await store.themes()).find((t) => t.active);
      theme.textContent = active ? active.name : "";
    } catch (e) { console.error(e); }
  };
  store.onChange((table) => {
    if (table === "themes") loadThemes();
    else if (table === "settings") loadSettings();
    else if (table !== "questions") { loadThemes(); loadSettings(); }
  });
  store.start(); loadThemes(); loadSettings();
}

/* ---------- vue animateur / régie ---------- */
async function viewMod() {
  app.replaceChildren(h("p", { class: "empty", style: "padding:24px" }, "Chargement des questions…"));
  if (!(await store.session())) return viewLogin(viewMod);
  const isRegie = VIEW === "regie";
  const seen = new Set();
  let firstLoad = true;
  const state = { themes: [], questions: [], settings: { ...DEFAULT_SETTINGS }, filter: "active", history: false, themesPanel: false, editing: null, draft: "" };

  const act = async (fn) => { try { await fn(); } catch (e) { console.error(e); toast("Action refusée. Vérifie la connexion."); } };
  const setStatus = async (q, status) => {
    const before = { ...q };
    Object.assign(q, patchFor(status)); // affichage immédiat, la base suit
    render();
    try { await store.update(q.id, patchFor(status)); }
    catch (e) { console.error(e); Object.assign(q, before); render(); toast("Action refusée. Vérifie la connexion."); }
  };

  const typing = () => !!document.activeElement?.dataset?.keepFocus;
  const safeRender = () => { if (state.editing || typing()) state.stale = true; else render(); };
  async function refresh() {
    try {
      [state.themes, state.questions] = await Promise.all([store.themes(), store.questions()]);
      if (!state.editing) render(); else state.stale = true;
    } catch (e) { console.error(e); toast("Connexion perdue, nouvelle tentative…"); }
  }
  async function loadSettings() {
    try {
      state.settings = { ...DEFAULT_SETTINGS, ...(await store.getSettings()) };
      applyBranding(state.settings);
      safeRender();
    } catch (e) { console.error(e); }
  }
  async function loadThemes() {
    try { state.themes = await store.themes(); safeRender(); } catch (e) { console.error(e); }
  }
  function applyQuestion(p) {
    const row = p.new && p.new.id ? p.new : null;
    if (p.eventType === "DELETE") state.questions = state.questions.filter((q) => q.id !== p.old?.id);
    else if (row) {
      const i = state.questions.findIndex((q) => q.id === row.id);
      if (i === -1) state.questions.push(row); else state.questions[i] = { ...state.questions[i], ...row };
    }
    safeRender();
  }

  function card(q, kind, showTheme) {
    const theme = state.themes.find((t) => t.id === q.theme_id);
    const fresh = !firstLoad && !seen.has(q.id);
    seen.add(q.id);
    const editing = state.editing === q.id;
    let body;
    if (editing) {
      const ta = h("textarea", { maxlength: CONFIG.MAX_CARACTERES, "aria-label": "Corriger la question",
        oninput: (e) => (state.draft = e.target.value) });
      ta.value = state.draft;
      setTimeout(() => ta.focus(), 0);
      body = [ta, h("div", { class: "actions" },
        h("button", { class: "btn primary small", onclick: () => act(async () => {
          const text = state.draft.trim();
          if (text.length < 3) return toast("La question doit faire au moins 3 caractères.");
          await store.update(q.id, { text }); q.text = text; state.editing = null; render();
        }) }, "Enregistrer"),
        h("button", { class: "btn ghost small", onclick: () => { state.editing = null; render(); } }, "Annuler"))];
    } else {
      body = [h("p", { class: "text", text: q.text })];
    }
    const meta = h("div", { class: "meta" },
      q.author ? h("span", {}, q.author) : null,
      h("span", {}, kind === "validated" ? "Validée à " + heure(q.validated_at) : "Reçue à " + heure(q.created_at)),
      showTheme && theme ? h("span", { class: "chip" }, theme.name) : null);
    const editBtn = isRegie && !editing ? h("button", { class: "btn ghost small",
      onclick: () => { state.editing = q.id; state.draft = q.text; render(); } }, "Corriger") : null;
    const actions = editing ? null : kind === "pending"
      ? h("div", { class: "actions" },
          h("button", { class: "btn ok", onclick: () => setStatus(q, "validated") }, "Valider"),
          h("button", { class: "btn danger", onclick: () => setStatus(q, "rejected") }, "Rejeter"), editBtn)
      : h("div", { class: "actions" },
          h("button", { class: "btn primary", onclick: () => setStatus(q, "asked") }, "Posée au micro"),
          h("button", { class: "btn ghost", onclick: () => setStatus(q, "pending") }, "Remettre en attente"), editBtn);
    return h("article", { class: "card" + (fresh ? " fresh" : "") + (editing ? " editing" : "") }, ...body, meta, actions);
  }

  function exportCsv() {
    const cell = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const statut = { pending: "en attente", validated: "validée", asked: "posée", rejected: "rejetée" };
    const rows = [["Table ronde", "Statut", "Question", "Prénom", "Reçue", "Validée", "Posée"]];
    for (const q of state.questions) {
      rows.push([state.themes.find((t) => t.id === q.theme_id)?.name, statut[q.status], q.text, q.author,
        heure(q.created_at), heure(q.validated_at), heure(q.asked_at)]);
    }
    const blob = new Blob(["\ufeff" + rows.map((r) => r.map(cell).join(";")).join("\n")], { type: "text/csv;charset=utf-8" });
    const a = h("a", { href: URL.createObjectURL(blob), download: "questions-conference.csv" });
    document.body.append(a); a.click(); a.remove();
  }

  function render() {
    const active = state.themes.find((t) => t.active);
    if (!["active", "all"].includes(state.filter) && !state.themes.some((t) => t.id === state.filter)) state.filter = "active";
    const filterId = state.filter === "active" ? active?.id : state.filter === "all" ? null : state.filter;
    const inFilter = (q) => state.filter === "all" || q.theme_id === filterId;
    const showTheme = state.filter === "all";
    const validated = state.questions.filter((q) => q.status === "validated" && inFilter(q))
      .sort((a, b) => (a.validated_at || "").localeCompare(b.validated_at || ""));
    const pending = state.questions.filter((q) => q.status === "pending" && inFilter(q))
      .sort((a, b) => b.created_at.localeCompare(a.created_at));

    const filterSel = h("select", { "aria-label": "Questions affichées", onchange: (e) => { state.filter = e.target.value; render(); } },
      h("option", { value: "active" }, "Table ronde en cours"),
      ...state.themes.map((t) => h("option", { value: t.id }, t.name)),
      h("option", { value: "all" }, "Toutes les tables rondes"));
    filterSel.value = state.filter;

    let regieTools = null;
    if (isRegie) {
      const activeSel = h("select", { "aria-label": "Table ronde en cours", onchange: (e) => act(() => store.setActive(e.target.value)) },
        !active ? h("option", { value: "" }, "Aucune") : null,
        ...state.themes.map((t) => h("option", { value: t.id }, t.name)));
      activeSel.value = active?.id || "";
      regieTools = [
        h("div", { class: "group" }, h("span", {}, "En cours"), activeSel,
          h("button", { class: "btn small", "aria-pressed": String(state.themesPanel), "aria-expanded": String(state.themesPanel),
            onclick: () => { state.themesPanel = !state.themesPanel; render(); } },
            state.themesPanel ? "Fermer la gestion" : "Gérer les tables rondes")),
        h("div", { class: "group" },
          h("button", { class: "btn small", "aria-pressed": String(state.history), onclick: () => { state.history = !state.history; render(); } },
            state.history ? "Masquer l'historique" : "Historique"),
          h("button", { class: "btn small", onclick: exportCsv }, "Exporter en CSV"),
          h("a", { class: "btn small", href: BASE_URL + "?v=reglages" }, "Personnaliser")),
      ];
    }

    const bar = h("header", { class: "bar" },
      h("div", { class: "title-wrap" },
        safeLogo(state.settings) ? h("img", { src: safeLogo(state.settings), alt: "" }) : null,
        h("div", { class: "title" }, h("h1", {}, state.settings.event_name || (isRegie ? "Régie" : "Animateur")),
          h("p", {}, (state.settings.event_name ? (isRegie ? "Régie. " : "Animateur. ") : "") +
            (active ? "En cours : " + active.name : "Aucune table ronde en cours")))),
      h("div", { class: "group" }, h("span", {}, "Afficher"), filterSel),
      regieTools,
      h("nav", { class: "group", "aria-label": "Changer de vue" },
        h("a", { class: "btn small", href: BASE_URL + (isRegie ? "?v=anim" : "?v=regie") }, isRegie ? "Vue animateur" : "Vue régie"),
        h("a", { class: "btn small", href: BASE_URL + "?v=ecran", target: "_blank" }, "Écran QR"),
        h("a", { class: "btn small", href: BASE_URL, target: "_blank" }, "Page du public")),
      !DEMO ? h("button", { class: "btn ghost small", onclick: async () => { await store.logout(); location.reload(); } }, "Déconnexion") : null);

    const col = (kind, title, list, emptyText) => h("section", { class: "col " + kind, "aria-label": title },
      h("div", { class: "col-head" }, h("h2", {}, title), h("span", { class: "pill" }, list.length)),
      list.length ? list.map((q) => card(q, kind, showTheme)) : h("p", { class: "empty" }, emptyText));

    let history = null;
    if (isRegie && state.history) {
      const done = state.questions.filter((q) => (q.status === "asked" || q.status === "rejected") && inFilter(q))
        .sort((a, b) => b.created_at.localeCompare(a.created_at));
      history = h("section", { class: "history", "aria-label": "Historique" },
        done.length ? done.map((q) => h("div", { class: "history-row" },
          h("div", {}, h("p", { class: "text", text: q.text }),
            h("p", { class: "meta" }, q.status === "asked" ? "Posée à " + heure(q.asked_at) : "Rejetée")),
          h("button", { class: "btn ghost small", onclick: () => setStatus(q, "pending") }, "Restaurer")))
        : h("p", { class: "empty" }, "Aucune question posée ou rejetée pour le moment."));
    }

    let themesPanel = null;
    if (isRegie && state.themesPanel) {
      const ordered = [...state.themes].sort((a, b) => (a.position || 0) - (b.position || 0));
      const move = (i, dir) => act(async () => {
        const ids = ordered.map((t) => t.id);
        [ids[i], ids[i + dir]] = [ids[i + dir], ids[i]];
        await store.reorderThemes(ids); await loadThemes();
      });
      const rows = ordered.map((t, i) => {
        const n = state.questions.filter((q) => q.theme_id === t.id).length;
        const name = h("input", { value: t.name, maxlength: 80, "aria-label": "Nom de la table ronde", "data-keep-focus": "1",
          onkeydown: (e) => { if (e.key === "Enter") e.target.blur(); if (e.key === "Escape") { e.target.value = t.name; e.target.blur(); } },
          onblur: (e) => {
            const v = e.target.value.trim();
            if (v && v !== t.name) act(async () => { await store.renameTheme(t.id, v); await loadThemes(); toast("Table ronde renommée."); });
            else { e.target.value = t.name; if (state.stale) { state.stale = false; setTimeout(render, 0); } }
          } });
        return h("div", { class: "theme-row" },
          name,
          t.active ? h("span", { class: "tag" }, "En cours")
            : h("button", { class: "btn small", onclick: () => act(async () => { await store.setActive(t.id); await loadThemes(); }) }, "Mettre en cours"),
          h("span", { class: "count" }, n + (n > 1 ? " questions" : " question")),
          h("button", { class: "btn ghost small icon", "aria-label": "Monter " + t.name, disabled: i === 0, onclick: () => move(i, -1) }, "↑"),
          h("button", { class: "btn ghost small icon", "aria-label": "Descendre " + t.name, disabled: i === ordered.length - 1, onclick: () => move(i, 1) }, "↓"),
          h("button", { class: "btn danger small", onclick: () => {
            const msg = `Supprimer « ${t.name} » ?` + (n ? `\n\nSes ${n} question(s) resteront visibles dans « Toutes les tables rondes ».` : "");
            if (!confirm(msg)) return;
            act(async () => {
              await store.deleteTheme(t.id);
              const rest = ordered.filter((x) => x.id !== t.id);
              if (t.active && rest.length) await store.setActive(rest[0].id);
              await Promise.all([loadThemes(), refresh()]);
              toast("Table ronde supprimée.");
            });
          } }, "Supprimer"));
      });
      const newName = h("input", { placeholder: "Nom de la nouvelle table ronde", maxlength: 80, "aria-label": "Nom de la nouvelle table ronde",
        "data-keep-focus": "1", onkeydown: (e) => { if (e.key === "Enter") addBtn.click(); } });
      const addBtn = h("button", { class: "btn primary small", onclick: () => act(async () => {
        const v = newName.value.trim(); if (!v) return newName.focus();
        newName.value = ""; await store.addTheme(v); await loadThemes(); toast("Table ronde ajoutée.");
      }) }, "Ajouter");
      themesPanel = h("section", { class: "themes-panel", "aria-label": "Gestion des tables rondes" },
        h("h2", {}, "Tables rondes"),
        h("p", { class: "hint" }, "Clique sur un nom pour le modifier, puis Entrée. L'ordre est celui des menus."),
        rows.length ? rows : h("p", { class: "empty" }, "Aucune table ronde. Ajoute la première ci-dessous : elle sera mise en cours automatiquement."),
        h("div", { class: "theme-add" }, newName, addBtn));
    }

    app.replaceChildren(h("div", { class: "mod" },
      h("div", {}, demoBanner(), bar, themesPanel),
      h("div", { class: "cols" },
        col("validated", "À lire au micro", validated, "Valide une question à droite pour la faire apparaître ici."),
        col("pending", "Reçues", pending, "Les questions du public arrivent ici dès qu'elles sont envoyées.")),
      history));
    firstLoad = false;
  }

  store.onChange((table, payload) => {
    if (table === "questions" && payload) applyQuestion(payload);
    else if (table === "themes") loadThemes();
    else if (table === "settings") loadSettings();
    else { refresh(); if (table === "all") loadSettings(); } // démo, ou reconnexion du temps réel
  });
  store.start();
  await Promise.all([refresh(), loadSettings()]);
  setInterval(refresh, 20000); // filet de sécurité si le temps réel décroche
}

/* ---------- vue personnalisation ---------- */
async function viewReglages() {
  if (!(await store.session())) return viewLogin(viewReglages);
  let s = { ...DEFAULT_SETTINGS, ...(await store.getSettings()) };
  let dirty = false;
  const preview = h("div", { class: "preview" });
  const status = h("p", { class: "msg", role: "status", "aria-live": "polite" });

  const renderPreview = () => {
    applyBranding(s);
    preview.replaceChildren(brandHeader(s) || "",
      h("p", { class: "pv-title", text: s.participant_title || DEFAULT_SETTINGS.participant_title }),
      h("p", { class: "p-theme" }, "En ce moment : ", h("strong", {}, "Table ronde 1")),
      h("span", { class: "btn primary pv-btn", "aria-hidden": "true" }, "Envoyer ma question"),
      h("p", { class: "msg ok", text: s.thanks_message }));
  };
  const set = (k, v) => { s[k] = v; dirty = true; status.textContent = ""; renderPreview(); };
  const text = (k, label, { max = 120, multiline = false, hint, placeholder } = {}) => {
    const id = "f-" + k;
    return h("div", { class: "field" }, h("label", { for: id }, label),
      h(multiline ? "textarea" : "input", { id, maxlength: max, value: s[k] || "", placeholder,
        oninput: (e) => set(k, e.target.value) }),
      hint ? h("span", { class: "hint" }, hint) : null);
  };

  const logoBox = h("div", { class: "logo-box" });
  const renderLogo = () => logoBox.replaceChildren(
    safeLogo(s) ? h("img", { src: safeLogo(s), alt: "Logo actuel" }) : h("span", { class: "muted" }, "Aucun logo"),
    safeLogo(s) ? h("button", { class: "btn danger small", type: "button", onclick: () => { set("logo", ""); renderLogo(); } }, "Retirer le logo") : null);
  const fileInput = h("input", { id: "f-logo", type: "file", accept: "image/png,image/jpeg,image/webp,image/svg+xml",
    onchange: async (e) => {
      const f = e.target.files[0]; if (!f) return;
      try { set("logo", await logoToDataUrl(f)); renderLogo(); } catch (err) { toast(err.message); }
      e.target.value = "";
    } });

  const color = h("input", { id: "f-accent", type: "color", value: s.accent || DEFAULT_SETTINGS.accent,
    oninput: (e) => set("accent", e.target.value) });
  const askName = h("input", { id: "f-ask", type: "checkbox", onchange: (e) => set("ask_name", e.target.checked) });
  askName.checked = !!s.ask_name;
  const screenTheme = h("select", { id: "f-screen", onchange: (e) => set("screen_theme", e.target.value) },
    h("option", { value: "dark" }, "Sombre"), h("option", { value: "light" }, "Clair"),
    h("option", { value: "auto" }, "Selon l'ordinateur"));
  screenTheme.value = s.screen_theme || "auto";

  const save = h("button", { class: "btn primary", type: "submit" }, "Enregistrer");
  const form = h("form", { onsubmit: async (e) => {
    e.preventDefault(); save.disabled = true;
    try {
      await store.saveSettings(s); dirty = false;
      status.className = "msg ok"; status.textContent = "Personnalisation enregistrée. Les écrans ouverts se mettent à jour.";
    } catch (err) {
      console.error(err);
      status.className = "msg err"; status.textContent = "Enregistrement impossible. Vérifie la connexion, ou essaie un logo plus léger.";
    }
    save.disabled = false;
  } },
    h("fieldset", {}, h("legend", {}, "Événement"),
      text("event_name", "Nom de l'événement", { placeholder: "Ex. Les Rencontres de la montagne" }),
      text("event_subtitle", "Sous-titre", { hint: "Date, lieu… Facultatif.", placeholder: "Ex. Vendredi 16 octobre, Gap" }),
      h("div", { class: "field" }, h("label", { for: "f-logo" }, "Logo"), logoBox, fileInput,
        h("span", { class: "hint" }, "PNG transparent ou SVG de préférence. Redimensionné automatiquement.")),
      h("div", { class: "field" }, h("label", { for: "f-accent" }, "Couleur principale"), color,
        h("span", { class: "hint" }, "Utilisée pour les boutons. Le texte s'adapte pour rester lisible."))),
    h("fieldset", {}, h("legend", {}, "Page participant"),
      text("participant_title", "Titre de la page", { max: 90 }),
      text("thanks_message", "Message après envoi", { max: 160, multiline: true }),
      h("label", { class: "check", for: "f-ask" }, askName, "Demander le prénom (facultatif pour le public)")),
    h("fieldset", {}, h("legend", {}, "Écran de projection"),
      text("screen_title", "Phrase au-dessus du QR code", { max: 60 }),
      h("div", { class: "field" }, h("label", { for: "f-screen" }, "Fond de l'écran"), screenTheme)),
    h("div", { class: "actions" }, save), status);

  window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

  app.replaceChildren(demoBanner() || "",
    h("header", { class: "bar" },
      h("div", { class: "title-wrap" }, h("div", { class: "title" }, h("h1", {}, "Personnalisation"),
        h("p", {}, "Logo, nom de l'événement et textes affichés au public"))),
      h("a", { class: "btn small", href: BASE_URL + "?v=regie" }, "Retour à la régie")),
    h("main", { class: "reglages" }, form,
      h("div", { class: "preview-wrap" }, h("h2", {}, "Aperçu de la page participant"), preview,
        h("div", { class: "actions" },
          h("a", { class: "btn small", href: BASE_URL, target: "_blank" }, "Ouvrir la page participant"),
          h("a", { class: "btn small", href: BASE_URL + "?v=ecran", target: "_blank" }, "Ouvrir l'écran QR")))));
  renderLogo();
  renderPreview();
}

/* ---------- démarrage ---------- */
if (VIEW === "anim" || VIEW === "regie") viewMod();
else if (VIEW === "reglages") viewReglages();
else if (VIEW === "ecran") viewEcran();
else viewParticipant();
</script>
</body>
</html>
